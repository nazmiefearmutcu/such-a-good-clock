name: Desktop Builds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run desktop:build:mac
          - name: Windows
            os: windows-latest
            command: npm run desktop:build:win
          - name: Linux
            os: ubuntu-latest
            command: npm run desktop:build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Build desktop package
        run: ${{ matrix.command }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: such-a-good-clock-${{ matrix.name }}
          path: |
            dist-native/*.dmg
            dist-native/*.zip
            dist-native/*.exe
            dist-native/*.AppImage
            dist-native/*.deb
            dist-native/*.tar.gz
            dist-native/latest*.yml
          if-no-files-found: ignore

      - name: Attach desktop artifact to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Only the distributable installers/archives at the dist-native root —
          # NOT the unpacked app dirs (mac-arm64/, win-unpacked/, linux-unpacked/),
          # which would flood the release with raw Electron files and trip the
          # GitHub secondary upload rate limit.
          files: |
            dist-native/*.dmg
            dist-native/*.zip
            dist-native/*.exe
            dist-native/*.AppImage
            dist-native/*.deb
            dist-native/*.tar.gz
            dist-native/*.blockmap
            dist-native/latest*.yml
          fail_on_unmatched_files: false
          generate_release_notes: false
